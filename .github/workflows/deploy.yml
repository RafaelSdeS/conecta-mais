# O Space clona este repositório no build, mas não sabe quando a main muda.
# A cada push na main, pede um Factory rebuild (sem cache) para publicar a versão nova.
# Configuração no GitHub: secret HF_TOKEN (token de escrita do Hugging Face)
# e variável HF_SPACE (ex.: usuario/conecta-mais).
name: Atualiza o protótipo

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Factory rebuild do Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $HF_TOKEN" \
            "https://huggingface.co/api/spaces/$HF_SPACE/restart?factory=true"
