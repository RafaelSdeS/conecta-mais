[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "conecta-engine"
version = "0.1.0"
description = "Conecta+ — Motor de scores, financeiro e otimização"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "geopandas>=0.14",
    "scipy>=1.12",
    "docplex>=2.25",         # CPLEX Python API (Community Edition inclusa)
    "pulp>=2.8",             # fallback solver CBC, sem licença
    "pyarrow>=15.0",         # leitura de GeoParquet
    "pydantic>=2.6",         # validação dos parâmetros de entrada
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.4", "mypy>=1.9"]

[tool.setuptools.packages.find]
where = ["."]
include = ["conecta*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"
