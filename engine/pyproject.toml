[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conecta-engine"
version = "0.1.0"
description = "Conecta+ — Motor de scores, financeiro e otimização"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pandas>=2.2",
    "geopandas>=0.14",
    "scipy>=1.13",
    "pulp>=2.8",
    "pyarrow>=15.0",
    "pydantic>=2.6",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",        # TestClient do FastAPI
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["conecta*", "api*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"
